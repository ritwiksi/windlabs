name: Cache verified ERA5 2025 wind resource
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ github.ref_name }} }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Fetch complete Northern Maine ERA5 2025 hourly resource
        run: python scripts/fetch_wind.py
      - name: Validate real-data attribution
        run: |
          python - <<'PY'
          import json
          data=json.load(open('backend/app/wind_rose.json'))
          assert data['metadata']['is_historical']
          assert data['metadata']['sample_count']>=8000
          assert len(data['frequencies'])==12
          assert abs(sum(map(sum,data['frequencies']))-1)<1e-6
          PY
      - name: Commit cached historical distribution
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/wind_rose.json
          git diff --cached --quiet || (git commit -m 'data: cache verified 2025 ERA5 wind rose [wind-cache]' && git push)
