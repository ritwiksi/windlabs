name: Validate WindLab
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install physics and test dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Test FastAPI, physics, and optimization
        env:
          PYTHONPATH: backend
        run: pytest -v backend/tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck and production build
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend and frontend dependencies
        run: |
          pip install -r backend/requirements.txt
          npm install --no-audit --no-fund
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise 3D simulation and optimization in browser
        run: npm run test:e2e
      - name: Upload browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windlab-browser-smoke
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
